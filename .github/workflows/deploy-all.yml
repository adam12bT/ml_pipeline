name: Deploy Everything

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type YES to deploy everything'
        required: true
        default: 'NO'

jobs:

  check:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm deployment
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "YES" ]; then
            echo "❌ You must type YES to confirm full deployment"
            exit 1
          fi
          echo "✅ Full deployment confirmed"

  deploy-space-1:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy Space 1
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_USERNAME: ${{ secrets.HF_USERNAME }}
        run: |
          git config --global user.email "ci@github.com"
          git config --global user.name "GitHub Actions"
          git clone https://${HF_USERNAME}:${HF_TOKEN}@huggingface.co/spaces/${HF_USERNAME}/ai-pipeline-ingest hf-space-1
          cp spaces/space-1-ingest/app.py          hf-space-1/app.py
          cp spaces/space-1-ingest/requirements.txt hf-space-1/requirements.txt
          cp spaces/space-1-ingest/Dockerfile       hf-space-1/Dockerfile
          if [ -f "spaces/space-1-ingest/README.md" ]; then
            cp spaces/space-1-ingest/README.md hf-space-1/README.md
          fi
          cd hf-space-1
          git add .
          git diff --cached --quiet || git commit -m "Full deploy — $(date '+%Y-%m-%d %H:%M')"
          git push
          echo "✅ Space 1 done"

  deploy-space-2:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy Space 2
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_USERNAME: ${{ secrets.HF_USERNAME }}
        run: |
          git config --global user.email "ci@github.com"
          git config --global user.name "GitHub Actions"
          git clone https://${HF_USERNAME}:${HF_TOKEN}@huggingface.co/spaces/${HF_USERNAME}/ai-pipeline-clean hf-space-2
          cp spaces/space-2-clean/app.py          hf-space-2/app.py
          cp spaces/space-2-clean/requirements.txt hf-space-2/requirements.txt
          cp spaces/space-2-clean/Dockerfile       hf-space-2/Dockerfile
          if [ -f "spaces/space-2-clean/README.md" ]; then
            cp spaces/space-2-clean/README.md hf-space-2/README.md
          fi
          cd hf-space-2
          git add .
          git diff --cached --quiet || git commit -m "Full deploy — $(date '+%Y-%m-%d %H:%M')"
          git push
          echo "✅ Space 2 done"

  deploy-space-3:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy Space 3
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_USERNAME: ${{ secrets.HF_USERNAME }}
        run: |
          git config --global user.email "ci@github.com"
          git config --global user.name "GitHub Actions"
          git clone https://${HF_USERNAME}:${HF_TOKEN}@huggingface.co/spaces/${HF_USERNAME}/ai-pipeline-train hf-space-3
          cp spaces/space-3-train/app.py          hf-space-3/app.py
          cp spaces/space-3-train/requirements.txt hf-space-3/requirements.txt
          cp spaces/space-3-train/Dockerfile       hf-space-3/Dockerfile
          if [ -f "spaces/space-3-train/README.md" ]; then
            cp spaces/space-3-train/README.md hf-space-3/README.md
          fi
          cd hf-space-3
          git add .
          git diff --cached --quiet || git commit -m "Full deploy — $(date '+%Y-%m-%d %H:%M')"
          git push
          echo "✅ Space 3 done"

  deploy-space-4:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy Space 4
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_USERNAME: ${{ secrets.HF_USERNAME }}
        run: |
          git config --global user.email "ci@github.com"
          git config --global user.name "GitHub Actions"
          git clone https://${HF_USERNAME}:${HF_TOKEN}@huggingface.co/spaces/${HF_USERNAME}/ai-pipeline-explain hf-space-4
          cp spaces/space-4-explain/app.py          hf-space-4/app.py
          cp spaces/space-4-explain/requirements.txt hf-space-4/requirements.txt
          cp spaces/space-4-explain/Dockerfile       hf-space-4/Dockerfile
          if [ -f "spaces/space-4-explain/README.md" ]; then
            cp spaces/space-4-explain/README.md hf-space-4/README.md
          fi
          cd hf-space-4
          git add .
          git diff --cached --quiet || git commit -m "Full deploy — $(date '+%Y-%m-%d %H:%M')"
          git push
          echo "✅ Space 4 done"

  deploy-backend:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy Backend to Render
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          curl -s -X POST "$RENDER_DEPLOY_HOOK" -H "Content-Type: application/json" -d '{}'
          echo "✅ Render deploy triggered"

  deploy-frontend:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Vercel CLI
        run: npm install -g vercel
      - name: Deploy Frontend to Vercel
        env:
          VERCEL_TOKEN:      ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID:     ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          cd frontend
          vercel deploy --prod --token=$VERCEL_TOKEN --yes
          echo "✅ Vercel deployed"

  summary:
    needs: [deploy-space-1, deploy-space-2, deploy-space-3, deploy-space-4, deploy-backend, deploy-frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Deployment Summary
        run: |
          echo "🎉 Full deployment complete!"
          echo "  ✅ Space 1 — Ingest & Profile"
          echo "  ✅ Space 2 — Clean & Engineer"
          echo "  ✅ Space 3 — Train & Evaluate"
          echo "  ✅ Space 4 — Explain & Report"
          echo "  ✅ Backend — Render"
          echo "  ✅ Frontend — Vercel"