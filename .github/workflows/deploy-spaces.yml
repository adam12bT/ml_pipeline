name: Deploy Hugging Face Spaces

# ── When to run ────────────────────────────────────────────────────────────────
on:
  push:
    branches: [main]
    paths:
      # Only run when space files change
      - "spaces/**"
  workflow_dispatch:  # Also allow manual trigger from GitHub UI

# ── Jobs ───────────────────────────────────────────────────────────────────────
jobs:

  # ── Space 1: Ingest & Profile ─────────────────────────────────────────────
  deploy-space-1:
    name: Deploy Space 1 — Ingest & Profile
    runs-on: ubuntu-latest
    # Only run if space-1 files changed (or manual trigger)
    if: |
      github.event_name == 'workflow_dispatch' ||
      contains(join(github.event.commits.*.modified, ','), 'spaces/space-1-ingest')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Push to Hugging Face — Space 1
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_USERNAME: ${{ secrets.HF_USERNAME }}
        run: |
          # Install git-lfs
          git lfs install

          # Configure git
          git config --global user.email "ci@github.com"
          git config --global user.name "GitHub Actions"

          # Clone the HF space repo
          git clone https://HF_USERNAME:${HF_TOKEN}@huggingface.co/spaces/${HF_USERNAME}/ai-pipeline-ingest hf-space-1

          # Copy our files into it
          cp spaces/space-1-ingest/app.py          hf-space-1/app.py
          cp spaces/space-1-ingest/requirements.txt hf-space-1/requirements.txt
          cp spaces/space-1-ingest/Dockerfile       hf-space-1/Dockerfile
          cp spaces/space-1-ingest/README.md        hf-space-1/README.md

          # Push to HF
          cd hf-space-1
          git add .
          git diff --cached --quiet || git commit -m "Deploy from GitHub Actions — $(date '+%Y-%m-%d %H:%M')"
          git push
          echo "✅ Space 1 deployed!"

  # ── Space 2: Clean & Engineer ────────────────────────────────────────────
  deploy-space-2:
    name: Deploy Space 2 — Clean & Engineer
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      contains(join(github.event.commits.*.modified, ','), 'spaces/space-2-clean')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Push to Hugging Face — Space 2
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_USERNAME: ${{ secrets.HF_USERNAME }}
        run: |
          git lfs install
          git config --global user.email "ci@github.com"
          git config --global user.name "GitHub Actions"

          git clone https://HF_USERNAME:${HF_TOKEN}@huggingface.co/spaces/${HF_USERNAME}/ai-pipeline-clean hf-space-2

          cp spaces/space-2-clean/app.py           hf-space-2/app.py
          cp spaces/space-2-clean/requirements.txt  hf-space-2/requirements.txt
          cp spaces/space-2-clean/Dockerfile        hf-space-2/Dockerfile
          cp spaces/space-2-clean/README.md         hf-space-2/README.md

          cd hf-space-2
          git add .
          git diff --cached --quiet || git commit -m "Deploy from GitHub Actions — $(date '+%Y-%m-%d %H:%M')"
          git push
          echo "✅ Space 2 deployed!"

  # ── Space 3: Train & Evaluate ────────────────────────────────────────────
  deploy-space-3:
    name: Deploy Space 3 — Train & Evaluate
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      contains(join(github.event.commits.*.modified, ','), 'spaces/space-3-train')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Push to Hugging Face — Space 3
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_USERNAME: ${{ secrets.HF_USERNAME }}
        run: |
          git lfs install
          git config --global user.email "ci@github.com"
          git config --global user.name "GitHub Actions"

          git clone https://HF_USERNAME:${HF_TOKEN}@huggingface.co/spaces/${HF_USERNAME}/ai-pipeline-train hf-space-3

          cp spaces/space-3-train/app.py            hf-space-3/app.py
          cp spaces/space-3-train/requirements.txt   hf-space-3/requirements.txt
          cp spaces/space-3-train/Dockerfile         hf-space-3/Dockerfile
          cp spaces/space-3-train/README.md          hf-space-3/README.md

          cd hf-space-3
          git add .
          git diff --cached --quiet || git commit -m "Deploy from GitHub Actions — $(date '+%Y-%m-%d %H:%M')"
          git push
          echo "✅ Space 3 deployed!"

  # ── Space 4: Explain & Report ────────────────────────────────────────────
  deploy-space-4:
    name: Deploy Space 4 — Explain & Report
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      contains(join(github.event.commits.*.modified, ','), 'spaces/space-4-explain')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Push to Hugging Face — Space 4
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_USERNAME: ${{ secrets.HF_USERNAME }}
        run: |
          git lfs install
          git config --global user.email "ci@github.com"
          git config --global user.name "GitHub Actions"

          git clone https://HF_USERNAME:${HF_TOKEN}@huggingface.co/spaces/${HF_USERNAME}/ai-pipeline-explain hf-space-4

          cp spaces/space-4-explain/app.py           hf-space-4/app.py
          cp spaces/space-4-explain/requirements.txt  hf-space-4/requirements.txt
          cp spaces/space-4-explain/Dockerfile        hf-space-4/Dockerfile
          cp spaces/space-4-explain/README.md         hf-space-4/README.md

          cd hf-space-4
          git add .
          git diff --cached --quiet || git commit -m "Deploy from GitHub Actions — $(date '+%Y-%m-%d %H:%M')"
          git push
          echo "✅ Space 4 deployed!"
